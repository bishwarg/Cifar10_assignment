
program: main.py
method: grid

metric:
  name: val_accuracy
  goal: maximize

parameters:
  activation:
    value: "ReLU"
  optimizer:
    values: ["SGD", "Nesterov", "Adam", "Adagrad", "RMSprop", "Nadam"]
  learning_rate:
    value: 0.001
  batch_size:
    value: 128
  epochs:
    value: 20

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --mode
  - optimizer
  - ${args}
